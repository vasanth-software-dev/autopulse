name: Build AutoPulse Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            ERR_MSG=$(grep -A 8 "What went wrong:" build.log | tr '\r\n' ' ' | cut -c 1-500)
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(grep -E "(e: |FAILURE:|Error:)" build.log | head -n 5 | tr '\r\n' ' ' | cut -c 1-500)
            fi
            echo "::error file=app/build.gradle.kts,line=1,title=What Went Wrong::$ERR_MSG"
            exit $EXIT_CODE
          fi

      - name: Build Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Save Failure Log to Git Branch
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add -f build.log
          git commit -m "ci: save build failure log [skip ci]"
          git push -f origin build-logs || true

      - name: Verify APK Generated
        run: |
          echo "Listing generated APK files:"
          find app/build/outputs/apk/ -name "*.apk"

      - name: Prepare Direct APK for Release
        run: |
          mkdir -p release-apk
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          cp "$APK_FILE" release-apk/AutoPulse-v1.0.5.apk
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPulse-v1.0.5-APK
          path: release-apk/AutoPulse-v1.0.5.apk
          retention-days: 30

      - name: Publish GitHub Release with Direct APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: AutoPulse v1.0.5 (Direct APK Download)
          body: |
            ### 📱 AutoPulse Android App v1.0.5
            Download **AutoPulse-v1.0.5.apk** below directly to your phone.
            
            #### 🛠️ What's New & Upgraded in v1.0.5:
            - **Dynamic Repeat Interval (e.g. 5s)**: Fixed interval updating so changing from 30s to 5s takes effect immediately, both on new triggers and already-running tasks.
            - **Real OLX Notification Detection**: Built-in support matching actual OLX notifications (`"You have new messages"` / `"Open olx to check for missed updates"`) with automatic migration of existing rules.
            - **Interactive Interval Stepper & Presets**: Easily pick `5s`, `10s`, `15s`, `30s`, or `60s`, or use `[-]` / `[+]` precision steppers with immediate visual confirmation.
            - **Premium Obsidian UI/UX Upgrade**: High-contrast modern cards, live running pulse beacon indicators, tactile STOP alert buttons, refined typography, and quick OLX test simulator.
            - **Telegram STOP Inline & Polling**: Retained full remote stop button and command functionality (`/stop`, `/stopall`).
            
            #### 🚀 Installation Instructions:
            1. Download `AutoPulse-v1.0.5.apk` below.
            2. Open the file on your phone.
            3. If prompted by Android or Play Protect:
               - Tap **"More details"** -> **"Install anyway"** (Standard for sideloaded developer apps).
            4. Grant the required permissions inside the app.
          files: release-apk/AutoPulse-v1.0.5.apk
          draft: false
          prerelease: false

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace
        continue-on-error: true
